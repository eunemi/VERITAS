# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: the URL comes from `DATABASE_URL` via
# `app.core.config`, read in `alembic/env.py`. Two sources for one connection
# string is how a migration ends up running against the wrong database.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revision files sort by creation time, so `alembic history` reads in the order
# the migrations were written rather than by hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Autogenerated revisions get the same formatting as everything else, so a
# migration never shows up in review as a diff of import order.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
